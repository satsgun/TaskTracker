<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <section id="auth-view" class="auth-view" hidden>
        <div class="auth-card">
          <div class="auth-brand">
            <div class="auth-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 5.5l1.5 1.5l2.5-2.5"/><path d="M3.5 11.5l1.5 1.5l2.5-2.5"/><path d="M3.5 17.5l1.5 1.5l2.5-2.5"/>
                <line x1="11" y1="6" x2="20" y2="6"/><line x1="11" y1="12" x2="20" y2="12"/><line x1="11" y1="18" x2="20" y2="18"/>
              </svg>
            </div>
            <h1>Task Tracker</h1>
            <p id="auth-subtitle">Sign in to your account</p>
          </div>

          <form id="login-form" class="auth-form" novalidate>
            <div class="form-field">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" name="email" required />
            </div>
            <div class="form-field">
              <label for="login-password">Password</label>
              <div class="pw-wrap">
                <input type="password" id="login-password" name="password" required />
                <button type="button" class="pw-toggle" data-target="login-password" aria-label="Show password">
                  <svg class="ti-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="2"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  </svg>
                </button>
              </div>
            </div>
            <p class="field-error" id="login-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Sign in</button>
            <p class="auth-alt">New here? <button type="button" id="show-signup" class="link-btn">Create an account</button></p>
          </form>

          <form id="signup-form" class="auth-form" novalidate hidden>
            <div class="form-row">
              <div class="form-field">
                <label for="signup-first-name">First name</label>
                <input type="text" id="signup-first-name" name="first_name" placeholder="Jane" required />
              </div>
              <div class="form-field">
                <label for="signup-last-name">Last name</label>
                <input type="text" id="signup-last-name" name="last_name" placeholder="Doe" required />
              </div>
            </div>
            <div class="form-field">
              <label for="signup-email">Email</label>
              <input type="email" id="signup-email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="form-field">
              <label for="signup-password">Password</label>
              <div class="pw-wrap">
                <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" required />
                <button type="button" class="pw-toggle" data-target="signup-password" aria-label="Show password">
                  <svg class="ti-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="2"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-field">
              <label for="signup-confirm-password">Confirm password</label>
              <div class="pw-wrap">
                <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Re-enter password" required />
                <button type="button" class="pw-toggle" data-target="signup-confirm-password" aria-label="Show password">
                  <svg class="ti-eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="2"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  </svg>
                </button>
              </div>
              <p class="field-error" id="signup-confirm-password-error" role="alert" hidden>Passwords don't match</p>
            </div>
            <p class="field-error" id="signup-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary" disabled>Create account</button>
            <p class="auth-alt">Already have an account? <button type="button" id="show-login" class="link-btn">Sign in</button></p>
          </form>
        </div>
      </section>

      <div id="task-view" hidden>
      <header class="app-header">
        <div class="app-brand">
          <div class="app-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 5.5l1.5 1.5l2.5-2.5"/><path d="M3.5 11.5l1.5 1.5l2.5-2.5"/><path d="M3.5 17.5l1.5 1.5l2.5-2.5"/>
              <line x1="11" y1="6" x2="20" y2="6"/><line x1="11" y1="12" x2="20" y2="12"/><line x1="11" y1="18" x2="20" y2="18"/>
            </svg>
          </div>
          <h1>Task Tracker</h1>
        </div>
        <div class="header-controls">
          <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">🌙</button>
          <button type="button" id="logout-btn" class="btn btn-secondary">Log out</button>
          <p class="task-counter" id="task-counter">0 tasks · 0 pending</p>
        </div>
      </header>

      <section class="add-task" aria-label="Add task">
        <form id="add-task-form" class="add-task-form" novalidate>
          <div class="form-field form-field--description">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="What needs doing?" required />
            <p class="field-error" id="description-error" role="alert" hidden></p>
          </div>
          <div class="form-field form-field--priority">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="form-field form-field--due-date">
            <label for="due_date">Due date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
          <button type="submit" class="btn btn-primary">Add task</button>
        </form>
      </section>

      <section class="filter-bar" aria-label="Filters">
        <div class="status-toggle" role="group" aria-label="Status filter">
          <button type="button" class="toggle-btn" data-status="pending">Pending</button>
          <button type="button" class="toggle-btn is-active" data-status="all">All</button>
        </div>
        <div class="search-field">
          <label for="search" class="visually-hidden">Search tasks</label>
          <input type="search" id="search" name="q" placeholder="Search tasks…" />
        </div>
      </section>

      <ul class="legend">
        <li class="legend-item legend-item--overdue">Overdue</li>
        <li class="legend-item legend-item--complete">Complete</li>
        <li class="legend-item legend-item--incomplete">Incomplete, not overdue</li>
      </ul>

      <div id="error-state" class="state-panel state-panel--error" hidden>
        <p class="state-panel-title">Couldn't load your tasks</p>
        <p class="state-panel-subtitle">Check your connection and try again.</p>
        <button type="button" id="retry-btn" class="btn btn-primary">Retry</button>
      </div>

      <div id="empty-state" class="state-panel" hidden></div>

      <div id="action-banner" class="action-banner" aria-live="polite" hidden>
        <p class="banner-message"></p>
        <button type="button" class="banner-dismiss" aria-label="Dismiss">&times;</button>
      </div>

      <ul class="task-list" id="task-list"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

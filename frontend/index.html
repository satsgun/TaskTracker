<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Task Tracker</h1>
        <div class="header-controls">
          <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">🌙</button>
          <p class="task-counter" id="task-counter">0 tasks · 0 pending</p>
        </div>
      </header>

      <section class="add-task" aria-label="Add task">
        <form id="add-task-form" class="add-task-form" novalidate>
          <div class="form-field form-field--description">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="What needs doing?" required />
            <p class="field-error" id="description-error" role="alert" hidden></p>
          </div>
          <div class="form-field form-field--priority">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="form-field form-field--due-date">
            <label for="due_date">Due date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
          <button type="submit" class="btn btn-primary">Add task</button>
        </form>
      </section>

      <section class="filter-bar" aria-label="Filters">
        <div class="status-toggle" role="group" aria-label="Status filter">
          <button type="button" class="toggle-btn" data-status="pending">Pending</button>
          <button type="button" class="toggle-btn is-active" data-status="all">All</button>
        </div>
        <div class="search-field">
          <label for="search" class="visually-hidden">Search tasks</label>
          <input type="search" id="search" name="q" placeholder="Search tasks…" />
        </div>
      </section>

      <ul class="legend">
        <li class="legend-item legend-item--overdue">Overdue</li>
        <li class="legend-item legend-item--complete">Complete</li>
        <li class="legend-item legend-item--incomplete">Incomplete, not overdue</li>
      </ul>

      <div id="error-state" class="state-panel state-panel--error" hidden>
        <p class="state-panel-title">Couldn't load your tasks</p>
        <p class="state-panel-subtitle">Check your connection and try again.</p>
        <button type="button" id="retry-btn" class="btn btn-primary">Retry</button>
      </div>

      <div id="empty-state" class="state-panel" hidden></div>

      <div id="action-banner" class="action-banner" aria-live="polite" hidden>
        <p class="banner-message"></p>
        <button type="button" class="banner-dismiss" aria-label="Dismiss">&times;</button>
      </div>

      <ul class="task-list" id="task-list"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
